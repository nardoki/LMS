name: MasteryLMS CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality & Static Analysis
  # ---------------------------------------------------------------------------
  code-quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck Backend Microservices
        run: npm run typecheck

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Lint Frontend Codebase
        run: npm --prefix frontend run lint

  # ---------------------------------------------------------------------------
  # 2. Automated Test Suite
  # ---------------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Jest Test Suites
        run: npm test

  # ---------------------------------------------------------------------------
  # 3. Production Build Compilation
  # ---------------------------------------------------------------------------
  build:
    name: Compile Production Builds
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build All 4 NestJS Microservices
        run: npm run build

      - name: Build Next.js 16 Frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'http://localhost:3000' }}
        run: npm --prefix frontend run build

  # ---------------------------------------------------------------------------
  # 4. Containerization & Dockerfile Linting
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Gateway Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/gateway.Dockerfile
          push: false
          tags: masterylms-gateway:ci-test

      - name: Validate Course Service Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/course-svc.Dockerfile
          push: false
          tags: masterylms-course-svc:ci-test
