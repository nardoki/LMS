apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: masterylms-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/mastery-lms.git'
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: masterylms-prod
  syncPolicy:
    # Production uses manual sync or sync with approvals for safety
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=true
