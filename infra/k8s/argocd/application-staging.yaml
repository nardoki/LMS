apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: masterylms-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/mastery-lms.git'
    targetRevision: develop
    path: infra/k8s/overlays/staging
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: masterylms-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
