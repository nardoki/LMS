apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: masterylms-staging

namePrefix: staging-

resources:
  - ../../base

images:
  - name: ghcr.io/masterylms/gateway
    newTag: latest
  - name: ghcr.io/masterylms/course-svc
    newTag: latest
  - name: ghcr.io/masterylms/assessment-svc
    newTag: latest
  - name: ghcr.io/masterylms/mastery-svc
    newTag: latest
  - name: ghcr.io/masterylms/frontend
    newTag: latest

commonLabels:
  environment: staging
  managed-by: argocd
