name: mastery
services:
  # ---------------------------------------------------------------------------
  # Redis: Heatmap cache, BullMQ event queue & scheduled reminders
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: masterylms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Odoo Database: PostgreSQL 15 for Odoo ERP
  # ---------------------------------------------------------------------------
  odoo-db:
    image: postgres:15
    container_name: masterylms-odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secret_password
    ports:
      - "5433:5432"
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Odoo Community 17.0: Back office, enrollment invoicing & LMS connector
  # ---------------------------------------------------------------------------
  odoo:
    image: odoo:17.0
    container_name: masterylms-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo_secret_password
      - LMS_GATEWAY_URL=http://host.docker.internal:3000
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./odoo-addons:/mnt/extra-addons
    restart: unless-stopped

volumes:
  redis_data:
  odoo_db_data:
  odoo_web_data:
